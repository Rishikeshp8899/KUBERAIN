{{define "admin"}}

<div class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col md:flex-row gap-6">
    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 min-w-0 space-y-6">
        
        <!-- HEADER BANNER -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between bg-industrial-800 p-5 rounded-2xl border border-slate-800 gap-4">
            <div>
                <h2 class="text-xl font-black text-white tracking-tight flex items-center gap-2">
                    <i class="fa-solid fa-truck-fast text-blue-500"></i> Work Package Dispatch & Bidding
                </h2>
                <p class="text-xs text-slate-400 mt-1">Manage active work package bidding, dispatch allocations, and project closures.</p>
            </div>
            <div class="flex items-center gap-3">
                <span class="text-xs text-slate-400 font-mono">Logged in as: <span class="text-slate-200 font-bold">{{.AdminEmail}}</span></span>
            </div>
        </div>

        <!-- STATUS FILTER & SEARCH CONTROL BAR -->
        <div class="bg-industrial-800 p-4 rounded-2xl border border-slate-800 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex flex-wrap items-center gap-3 w-full sm:w-auto">
                <i class="fa-solid fa-filter text-slate-400 text-xs"></i>
                
                <!-- STATUS FILTER DROPDOWN -->
                <label for="statusFilter" class="text-xs font-bold text-slate-300 uppercase tracking-wider whitespace-nowrap">Status:</label>
                <select id="statusFilter" onchange="handleStatusChange(this.value)" class="bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-xl px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none font-mono">
                    <option value="current" selected>Current Work Packages</option>
                    <option value="completed">Completed Work Packages</option>
                    <option value="closed">Closed Work Packages</option>
                </select>

                <!-- SEARCH INPUT -->
                <div class="relative flex-1 sm:w-64">
                    <input type="text" id="searchInput" onkeyup="handleSearchInput(event)" placeholder="Search work packages..." class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-xl pl-8 pr-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                    <i class="fa-solid fa-search absolute left-2.5 top-2.5 text-slate-500 text-xs"></i>
                </div>
            </div>

            <span class="bg-blue-500/10 text-blue-400 border border-blue-500/20 text-[11px] px-3 py-1 rounded-xl font-mono">
                Endpoint: /admin/dispatch
            </span>
        </div>

        <!-- DYNAMIC WORK PACKAGES CONTAINER -->
        <div id="workPackagesContainer" class="space-y-4">
            <div class="bg-industrial-900 p-12 rounded-2xl border border-slate-800 text-center text-slate-500 space-y-2">
                <i class="fa-solid fa-spinner fa-spin text-3xl text-blue-500"></i>
                <p class="text-sm font-bold text-slate-400">Loading work packages...</p>
            </div>
        </div>

        <!-- DYNAMIC PAGINATION CONTAINER -->
        <div id="paginationContainer" class="flex justify-center items-center gap-2 pt-2"></div>

    </main>
</div>

<script>
let currentStatus = 'current';
let currentSearch = '';

// Fetch work packages dynamically from backend REST API
async function fetchWorkPackages(page = 1) {
    const container = document.getElementById('workPackagesContainer');

    container.innerHTML = `
        <div class="bg-industrial-900 p-12 rounded-2xl border border-slate-800 text-center text-slate-500 space-y-2">
            <i class="fa-solid fa-spinner fa-spin text-3xl text-blue-500"></i>
            <p class="text-sm font-bold text-slate-400">Loading work packages...</p>
        </div>
    `;

    try {
        const response = await fetch(`/admin/work-packages?status=${encodeURIComponent(currentStatus)}&search=${encodeURIComponent(currentSearch)}&page=${page}&limit=10`);
        const data = await response.json();
        renderWorkPackages(data.work_packages || data || []);
        renderPagination(data);
    } catch (error) {
        console.error("API Error:", error);
        container.innerHTML = `
            <div class="bg-industrial-900 p-12 rounded-2xl border border-slate-800 text-center text-rose-500 space-y-2">
                <i class="fa-solid fa-triangle-exclamation text-3xl"></i>
                <p class="text-sm font-bold">Failed to load work packages from API.</p>
            </div>
        `;
    }
}

// Helper to determine status badge styles dynamically
function getStatusBadgeClass(status) {
    const s = (status || currentStatus).toLowerCase();
    if (s === 'completed') return 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30';
    if (s === 'closed') return 'bg-slate-500/10 text-slate-400 border-slate-500/30';
    return 'bg-amber-500/10 text-amber-400 border-amber-500/30'; // default current/active
}

// Render work package list dynamically
function renderWorkPackages(packages) {
    const container = document.getElementById('workPackagesContainer');
    
    if (!packages || packages.length === 0) {
        container.innerHTML = `
            <div class="bg-industrial-800 p-8 rounded-2xl border border-slate-800 text-center text-slate-500">
                <p class="text-xs font-bold">No work packages found matching status "${currentStatus}".</p>
            </div>
        `;
        return;
    }

    container.innerHTML = packages.map(pkg => {
        const id = pkg.id || pkg.ID;
        const status = pkg.status || currentStatus;
        const badgeClass = getStatusBadgeClass(status);

        return `
        <div class="bg-industrial-800 p-5 rounded-2xl border border-slate-800 hover:border-slate-700 transition space-y-4">
            <div class="flex justify-between items-center text-xs">
                <span class="font-mono font-bold text-blue-400">WP-#${id}</span>
                <span class="px-2.5 py-1 rounded-full text-[10px] font-bold uppercase border ${badgeClass}">
                    ${status}
                </span>
            </div>
            
            <div>
                <h4 class="text-sm font-bold text-white">${pkg.title || pkg.Title || 'Work Package Title'}</h4>
                <p class="text-xs text-slate-400 mt-1">${pkg.description || pkg.Description || 'No description provided.'}</p>
            </div>

            <!-- ACTION BUTTONS -->
            <div class="flex items-center justify-end gap-3 pt-2 border-t border-slate-800/80">
                <button type="button" onclick="viewDetails(${id})" class="bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold text-xs px-3.5 py-2 rounded-xl transition flex items-center gap-2 border border-slate-600">
                    <i class="fa-solid fa-eye"></i> See Details
                </button>
                <button type="button" onclick="dispatchWorkPackage(${id})" class="bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs px-3.5 py-2 rounded-xl transition flex items-center gap-2 shadow-lg shadow-blue-950/40">
                    <i class="fa-solid fa-paper-plane"></i> Bid / Dispatch
                </button>
            </div>
        </div>
        `;
    }).join('');
}

// Render pagination buttons
function renderPagination(data) {
    const pagination = document.getElementById('paginationContainer');
    if (!data || !data.total_pages || data.total_pages <= 1) {
        pagination.innerHTML = '';
        return;
    }

    let buttons = '';
    for (let i = 1; i <= data.total_pages; i++) {
        buttons += `
            <button onclick="fetchWorkPackages(${i})" class="px-3 py-1.5 rounded-xl text-xs font-mono font-bold ${data.current_page === i ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}">
                ${i}
            </button>
        `;
    }
    pagination.innerHTML = buttons;
}

// Dropdown change handler for "current", "completed", and "closed"
function handleStatusChange(status) {
    currentStatus = status;
    fetchWorkPackages(1);
}

// Search input handler
function handleSearchInput(event) {
    currentSearch = event.target.value;
    if (event.key === 'Enter') {
        fetchWorkPackages(1);
    }
}

// Action handlers
function viewDetails(wpId) {
    window.location.href = `/admin/work-packages/${wpId}`;
}

function dispatchWorkPackage(wpId) {
    window.location.href = `/admin/dispatch/${wpId}`;
}

// Initial load on page load
document.addEventListener('DOMContentLoaded', () => {
    fetchWorkPackages(1);
});
</script>

{{end}}
